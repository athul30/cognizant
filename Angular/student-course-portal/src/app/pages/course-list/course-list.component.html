<h2>Courses</h2>

<input [(ngModel)]="searchTerm" (ngModelChange)="onSearchChange()" placeholder="Search courses..." />

<p *ngIf="isLoading$ | async">Loading courses...</p>
<p *ngIf="error$ | async as error" class="error">{{ error }}</p>

<ng-container *ngIf="(courses$ | async) as courses">
  <div class="grid" *ngIf="courses.length; else noCourses">
    <div *ngFor="let course of courses; trackBy: trackByCourseId" (click)="onCourseSelected(course.id)">
      <app-course-card [course]="course" (enrollRequested)="onEnroll($event)"></app-course-card>
    </div>
  </div>
  <ng-template #noCourses>
    <p>No courses available.</p>
  </ng-template>
</ng-container>

<p *ngIf="selectedCourseId">Selected course ID: {{ selectedCourseId }}</p>
